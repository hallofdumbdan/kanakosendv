<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Multi-Sender</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Discord Multi-Sender</h2>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="3" placeholder="Enter your message"></textarea>
        </div>

        <div class="mapping-section">
            <label>Account & Channel Mapping</label>
            <div id="mapping-container">
                <!-- Rows will be added here dynamically -->
            </div>
            <button onclick="addRow()" class="add-btn">+ Add Account Pair</button>
        </div>

        <div class="form-group">
            <label for="delay">Delay (seconds)</label>
            <input type="number" step="0.1" id="delay" value="5">
        </div>

        <div class="button-group">
            <button onclick="startSending()" id="start-button">Start Sending</button>
            <button onclick="stopSending()" id="stop-button" class="secondary">Stop Sending</button>
        </div>

        <div id="logs"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
