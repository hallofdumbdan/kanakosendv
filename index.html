<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sender Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi-Sender</h1>
            <p class="subtitle">Automated Discord Messaging</p>
        </header>
        
        <section class="card">
            <div class="form-group">
                <label for="message">Message Content</label>
                <textarea id="message" rows="3" placeholder="What do you want to say?"></textarea>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <label>Account Mapping</label>
                <button onclick="addRow()" class="add-btn">+</button>
            </div>
            <div id="mapping-container">
                <!-- Rows added here -->
            </div>
            <p class="helper-text">Format: [Token] : [Channel ID]</p>
        </section>

        <section class="card">
            <div class="form-group">
                <label for="delay">Interval Delay (seconds)</label>
                <input type="number" step="0.1" id="delay" value="5">
            </div>
        </section>

        <div class="action-bar">
            <button onclick="startSending()" id="start-button" class="primary">Start Sending</button>
            <button onclick="stopSending()" id="stop-button" class="secondary">Stop</button>
        </div>

        <div id="logs"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
