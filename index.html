<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sender</title>
    <!-- Added Inter font for a more professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="brand-title">Multi-Sender</h1>
        </header>
        
        <main>
            <section class="card">
                <div class="card-header">
                    <label>Message Configuration</label>
                </div>
                <div class="form-group">
                    <textarea id="message" rows="3" placeholder="Enter your message content..."></textarea>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <label>Account & Channel Mapping</label>
                    <button onclick="addRow()" class="icon-btn add-btn" title="Add Account Pair">+</button>
                </div>
                <div id="mapping-container">
                    <!-- Rows injected here -->
                </div>
                <p class="helper-text">Each row defines a specific Token $\rightarrow$ Channel relationship.</p>
            </section>

            <section class="card">
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="delay">Interval Delay (seconds)</label>
                        <input type="number" step="0.1" id="delay" value="5">
                    </div>
                </div>
            </section>

            <div class="action-bar">
                <button onclick="startSending()" id="start-button" class="btn-primary">Start Deployment</button>
                <button onclick="stopSending()" id="stop-button" class="btn-secondary">Stop</button>
            </div>

            <div class="log-container">
                <div class="log-header">System Logs</div>
                <div id="logs"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
