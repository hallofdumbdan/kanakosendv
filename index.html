<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Multi-Sender</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Discord Multi-Sender</h2>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="3" placeholder="Enter your message"></textarea>
        </div>

        <div class="form-group">
            <label for="mapping">Account Mapping (token:channel_id)</label>
            <textarea id="mapping" rows="10" placeholder="token1:channel1&#10;token2:channel1&#10;token1:channel2"></textarea>
            <small style="color: #888; font-size: 0.75rem;">One pair per line. Use 'token:channel' format.</small>
        </div>

        <div class="form-group">
            <label for="delay">Delay (seconds)</label>
            <input type="number" step="0.1" id="delay" value="5">
        </div>

        <div class="button-group">
            <button onclick="startSending()" id="start-button">Start Sending</button>
            <button onclick="stopSending()" id="stop-button" class="secondary">Stop Sending</button>
        </div>

        <div id="logs"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
